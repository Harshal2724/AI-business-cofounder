{% extends "base.html" %}

{% block content %}

<div class="page-title">
    <h1>🛠 Problem Solver</h1>
    <p>Get practical solutions for your business challenges.</p>
</div>

<div class="form-card">

<form action="/problem-solver" method="POST">

<div class="input-group">
<label>Business Problem</label>

<textarea
name="problem"
placeholder="Describe the problem you're facing..."
required></textarea>

</div>

<div class="row">

<div class="input-group">
<label>Business Type</label>

<select name="business_type">
<option>Online</option>
<option>Offline</option>
<option>Hybrid</option>
</select>

</div>

<div class="input-group">

<label>Budget</label>

<input
type="text"
name="budget"
placeholder="₹50,000">

</div>

</div>

<div class="input-group">

<label>Additional Information (Optional)</label>

<textarea
name="extra_info"
placeholder="Any extra details..."></textarea>

</div>

<button class="submit-btn">

🛠 Solve Problem

</button>

</form>

</div>

{% if result %}

<div class="result-card">

<h2>🤖 Solution</h2>

<div class="result">

{{ result }}

</div>

</div>

{% endif %}

{% endblock %}
